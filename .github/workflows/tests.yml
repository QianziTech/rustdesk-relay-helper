name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local protocol regressions
        env:
          TEST_PYTHON: ${{ matrix.python }}
        run: |
          mkdir -p test-results
          python -m unittest discover -s tests -v 2>&1 | tee "test-results/unit-python-${TEST_PYTHON}.log"
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-python-${{ matrix.python }}
          path: test-results/*.log
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Chromium regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELAY_HELPER_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-browser.txt
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Login, configuration and relay controls
        run: |
          mkdir -p test-results
          python tests/browser_login.py 2>&1 | tee test-results/browser.log
      - name: Keep failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-regression
          path: test-results/*.log
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Workflow and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Bash entry points
        run: |
          bash -n bin/rustdesk-relay-helper
          bash -n manage.sh
      - name: Check GitHub Actions workflows
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
