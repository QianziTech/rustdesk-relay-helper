# 示例地址必须替换，不能直接用于部署。
[policy]
probe_interval_seconds = 20
connect_timeout_seconds = 2
fail_after = 3
recover_after = 6
minimum_hold_seconds = 300
# 成功点窗口上限 1–5；未满也可排名，每点两分钟后过期。
rtt_sample_count = 5
rtt_switch_margin_ms = 20

[node:usla]
address = usla.example.com:21117
tier = 10
enabled = true
rtt_ranked = true

[node:backup]
address = backup.example.com:21117
tier = 20
enabled = false
rtt_ranked = true

[node:cnhz]
address = cnhz.example.com:21117
tier = 100
enabled = true
rtt_ranked = false
